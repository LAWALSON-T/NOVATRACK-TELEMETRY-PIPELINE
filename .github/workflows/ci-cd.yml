name: NovaTrack Pipeline CI/CD

# When to run this workflow
on:
  push:
    branches: [ main, develop ]  # When code is pushed to these branches
    tags: [ 'v*' ]  # When version tag is created (v1.0.0)
  pull_request:
    branches: [ main, develop ]  # When PR is created

# Environment variables for all jobs
env:
  REGISTRY: docker.io
  IMAGE_NAME_INGESTION: ${{ secrets.DOCKERHUB_USERNAME }}/novatrack-ingestion
  IMAGE_NAME_AIRFLOW: ${{ secrets.DOCKERHUB_USERNAME }}/novatrack-airflow
  IMAGE_NAME_DBT: ${{ secrets.DOCKERHUB_USERNAME }}/novatrack-dbt

jobs:
  # ==========================================
  # JOB 1: Code Quality Checks
  # ==========================================
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # Cache pip packages for speed

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Step 4: Check code formatting with Black
      - name: Run Black (code formatting check)
        run: |
          black --check src/ tests/
          # Fails if code is not formatted

      # Step 5: Check import sorting with isort
      - name: Run isort (import sorting check)
        run: |
          isort --check-only src/ tests/

      # Step 6: Lint code with flake8
      - name: Run flake8 (linting)
        run: |
          flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203,W503
          # E203: whitespace before ':'
          # W503: line break before binary operator

      # Step 7: Type checking with mypy
      - name: Run mypy (type checking)
        run: |
          mypy src/ --ignore-missing-imports

      # Step 8: Check code complexity
      - name: Run radon (code complexity)
        run: |
          radon cc src/ -a -nb
          radon mi src/ -nb
        continue-on-error: true  # Don't fail build on complexity

  # ==========================================
  # JOB 2: Unit & Integration Tests
  # ==========================================
  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality  # Only run if code quality passes

    # Start PostgreSQL for integration tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Run unit tests
      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term
          # -v: verbose
          # --cov: coverage
          # --cov-report=xml: for codecov

      # Run integration tests
      - name: Run integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          API_URL: https://api.example.com
        run: |
          pytest tests/integration/ -v --cov=src --cov-append --cov-report=xml

      # Upload coverage report
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      # Check coverage threshold
      - name: Check coverage threshold
        run: |
          coverage report --fail-under=80
          # Fail if coverage is less than 80%

  # ==========================================
  # JOB 3: dbt Validation
  # ==========================================
  dbt-validation:
    name: dbt Model Validation
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: dbt_user
          POSTGRES_PASSWORD: dbt_password
          POSTGRES_DB: dbt_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install dbt
      - name: Install dbt
        run: |
          pip install dbt-core==1.7.8 dbt-postgres==1.7.8

      # Install dbt dependencies
      - name: dbt deps
        working-directory: dbt_project
        run: |
          dbt deps --profiles-dir .

      # Compile dbt models (check SQL syntax)
      - name: dbt compile
        working-directory: dbt_project
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: dbt_db
          POSTGRES_USER: dbt_user
          POSTGRES_PASSWORD: dbt_password
        run: |
          dbt compile --profiles-dir . --target dev

      # Parse dbt project (check for errors)
      - name: dbt parse
        working-directory: dbt_project
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: dbt_db
          POSTGRES_USER: dbt_user
          POSTGRES_PASSWORD: dbt_password
        run: |
          dbt parse --profiles-dir . --target dev

  # ==========================================
  # JOB 4: Docker Build & Security Scan
  # ==========================================
  docker-build:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: [tests, dbt-validation]  # Wait for tests to pass
    
    strategy:
      matrix:
        service: [ingestion, airflow, dbt]  # Build all 3 services

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Docker Buildx (advanced builder)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Docker image
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: false  # Don't push yet
          tags: novatrack-${{ matrix.service }}:test
          cache-from: type=gha  # Use GitHub Actions cache
          cache-to: type=gha,mode=max
          load: true  # Load image for scanning

      # Security scan with Trivy
      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: novatrack-${{ matrix.service }}:test
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          # Scan for vulnerabilities

      # Upload security results
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
        continue-on-error: true

  # ==========================================
  # JOB 5: Deploy to Docker Hub
  # ==========================================
  deploy:
    name: Deploy to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build
    # Only deploy on push to main or version tag
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    
    strategy:
      matrix:
        service: [ingestion, airflow, dbt]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Generate tags (latest, version, git sha)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/novatrack-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and push to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: true  # Push to Docker Hub
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64  # Multi-platform

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}