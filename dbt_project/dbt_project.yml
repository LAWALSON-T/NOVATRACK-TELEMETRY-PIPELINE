name: 'novatrack_analytics'
version: '1.0.0'
config-version: 2

profile: 'novatrack'

# Where to find different types of files
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

# Where dbt puts compiled files
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Model configuration
models:
  novatrack_analytics:
    # Staging models - views for cleaning data
    staging:
      +materialized: view
      +schema: staging
      +tags: ['staging']
      
    # Marts models - tables for analytics
    marts:
      +materialized: table
      +schema: analytics
      +tags: ['marts']